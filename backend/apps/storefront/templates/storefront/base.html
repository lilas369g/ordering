<!DOCTYPE html>
<html lang="en" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Store{% endblock %}</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; background: #f7f7fb; color: #222; }
    .container { max-width: 1120px; margin: 0 auto; padding: 24px; }
    .nav { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 24px; }
    .button, button { background: #4f46e5; color: white; border: none; border-radius: 10px; padding: 10px 14px; cursor: pointer; text-decoration: none; }
    .button.secondary { background: #111827; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { background: white; border-radius: 16px; padding: 18px; box-shadow: 0 10px 25px rgba(0,0,0,0.07); }
    .muted { color: #6b7280; }
    .badge { display:inline-block; background:#eef2ff; color:#3730a3; border-radius:999px; padding:4px 10px; font-size:12px; margin-bottom:8px; }
    .messages { margin-bottom: 16px; }
    .message { padding: 12px 14px; border-radius: 10px; margin-bottom: 8px; }
    .success { background: #ecfdf5; color: #065f46; }
    .error { background: #fef2f2; color: #991b1b; }
    .cart-table { width: 100%; border-collapse: collapse; background: white; border-radius: 16px; overflow: hidden; }
    .cart-table th, .cart-table td { padding: 12px; border-bottom: 1px solid #eee; text-align: right; }
    .flex { display:flex; gap:8px; align-items:center; }
    input[type=number] { width: 80px; padding: 8px; border:1px solid #d1d5db; border-radius:8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="nav">
      <a href="{% url 'storefront:product-list' %}" class="button secondary">المنتجات</a>
      <a href="{% url 'storefront:cart-page' %}" class="button">السلة{% if cart_count %} ({{ cart_count }}){% endif %}</a>
    </div>
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="message {% if message.tags == 'error' %}error{% else %}success{% endif %}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
